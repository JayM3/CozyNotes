name: Bug report
description: Report a reproducible problem in CozyNotes.
body:
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and version
      placeholder: Windows 11, macOS, or Linux distribution and display server
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use sample notes and omit personal note content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots, or other context
      description: Remove personal note content, credentials, and private paths before attaching files.
