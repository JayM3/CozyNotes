name: Feature request
description: Suggest an improvement to CozyNotes.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe what you are trying to do and where CozyNotes gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
